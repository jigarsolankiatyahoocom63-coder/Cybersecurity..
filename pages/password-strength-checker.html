<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Strength Checker | CyberSafe</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/themes.css" />
    <link rel="stylesheet" href="../css/print.css" />
  </head>
  <body data-page="password-checker" data-module="password-strength-checker">
    <header data-header></header>
    <main>
      <section class="section">
        <div class="container">
          <div class="section-header">
            <span class="badge">Password Hygiene</span>
            <h1>Password Strength Checker</h1>
          </div>
          <div class="quiz-card">
            <label>
              <span>Enter a password to test</span>
              <input class="input" type="password" data-password-input placeholder="Type a password here" />
            </label>
            <div data-password-result style="margin-top: 1rem;"></div>
          </div>
        </div>
      </section>
    </main>
    <footer data-footer></footer>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
