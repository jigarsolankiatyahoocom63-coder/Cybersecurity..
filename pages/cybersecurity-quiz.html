<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Safety Quiz | CyberSafe</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/themes.css" />
    <link rel="stylesheet" href="../css/print.css" />
  </head>
  <body data-page="quiz" data-module="cybersecurity-quiz">
    <header data-header></header>
    <main>
      <section class="section">
        <div class="container">
          <div class="section-header">
            <span class="badge">Campaign & Awareness</span>
            <h1>Cyber Safety Quiz</h1>
          </div>
          <div class="quiz-card">
            <p>Assess your awareness of passwords, phishing, safe transactions, privacy, and responsible digital habits.</p>
            <label>
              <span>Assessment mode</span>
              <select class="select" data-assessment-mode>
                <option value="standard">Standard</option>
                <option value="pre">Pre-awareness assessment</option>
                <option value="post">Post-awareness assessment</option>
              </select>
            </label>
            <form data-quiz-form>
              <button class="primary-btn focus-ring" type="submit">Submit quiz</button>
            </form>
            <div data-quiz-results></div>
          </div>
        </div>
      </section>
    </main>
    <footer data-footer></footer>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
