<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Data Protection Checklist | CyberSafe</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/themes.css" />
    <link rel="stylesheet" href="../css/print.css" />
  </head>
  <body data-page="checklist" data-module="data-protection-checklist">
    <header data-header></header>
    <main>
      <section class="section">
        <div class="container">
          <div class="section-header">
            <span class="badge">Personal Data Protection</span>
            <h1>Personal Data Protection Checklist</h1>
          </div>
          <div class="quiz-card">
            <div class="progress-bar"><div class="progress-fill" data-check-progress-fill style="width: 0%"></div></div>
            <p data-checklist-result>Protection score: 0% (0/0 items completed)</p>
            <div class="form-grid">
              <label><input data-check-item type="checkbox" /> I limit who can see my personal information on social media.</label>
              <label><input data-check-item type="checkbox" /> I review app permissions and remove unnecessary access.</label>
              <label><input data-check-item type="checkbox" /> I do not share my full address or ID numbers publicly.</label>
              <label><input data-check-item type="checkbox" /> I think carefully before posting travel plans or school details.</label>
              <label><input data-check-item type="checkbox" /> I verify unexpected requests for personal information through trusted channels.</label>
              <label><input data-check-item type="checkbox" /> I keep my privacy settings updated across accounts.</label>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer data-footer></footer>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
